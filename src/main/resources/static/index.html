<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora IMC</title>
</head>
<body>
<br>
<h1>Calcular IMC</h1>
<label>Peso (Kg): <input type="number" id="peso"></label>
<label>Altura (m): <input type="number" id="altura"></label>
<button onclick="calcular()">Calcular IMC</button>
<br>
<br>
<label>Resultado do IMC: <input type="number" id="resultadoImc"></label>
<label>Classificação do IMC: <input type="text" id="classificacao"></label>


<script>
    async function calcular(){
    const peso = document.getElementById("peso").value;
    const altura = document.getElementById("altura").value;
    const campo1 = document.getElementById("resultadoImc");
    const campo2 = document.getElementById("classificacao");

    const respostaImc = await fetch(`/imc/calcular/?peso=${peso}&altura=${altura}`);
    if (!respostaImc.ok){
    cammpo1.value = "Erro ao executar a operação"
    return;
    }

    const imc = await respostaImc.text();
    campoImc.value = Number(imc).toFixex(2);

 const respostaClassificacao = await fetch(`/imc/classificar?imc=${imc}`);
    campoClassificacao.value = await respostaClassificacao.text();

  }

</script>
</body>
</html>
